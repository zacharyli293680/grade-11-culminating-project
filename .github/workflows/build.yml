name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile, run rule tests, build jar
        run: sh scripts/build.sh

      - name: Render every screen headlessly
        run: java -Djava.awt.headless=true -cp "out/main:out/test:src/main/resources" poker.RenderScreens render

      - uses: actions/upload-artifact@v4
        with:
          name: poker-jar
          path: dist/poker.jar

      - uses: actions/upload-artifact@v4
        with:
          name: screen-renders
          path: render/
